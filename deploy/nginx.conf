# Coolify terminates TLS. Preserve its scheme instead of redirecting the
# internal HTTP connection, which would cause an HTTPS redirect loop.
map $http_x_forwarded_proto $public_scheme {
    default $scheme;
    https https;
    http http;
}

server {
    listen 8080;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;
    # Original audio is <=10 MB; JSON base64 adds approximately one third.
    client_max_body_size 16m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;

    location = /healthz {
        access_log off;
        default_type application/json;
        return 200 '{"status":"ok"}';
    }

    # These are Vite preview middleware, not real FastAPI endpoints. Preserve
    # the UI and return explicit errors rather than reporting fake success.
    location = /api/documents/process {
        client_max_body_size 110m;
        default_type application/json;
        add_header Cache-Control no-store;
        return 501 '{"message":"Document processing is a development preview and is not implemented on this production server."}';
    }
    location ~ ^/api/rooms/[^/]+/summary(/email)?$ {
        default_type application/json;
        add_header Cache-Control no-store;
        return 501 '{"message":"The summary and email preview endpoints are not implemented on this production server. No email was sent."}';
    }

    location = /api { return 308 /api/; }
    location /api/ {
        include /etc/nginx/includes/backend.conf;
    }
    # Preserve FastAPI's existing API documentation routes.
    location ~ ^/(docs(/.*)?|redoc|openapi\.json)$ {
        include /etc/nginx/includes/backend.conf;
    }
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location = /index.html {
        add_header Cache-Control no-cache;
    }
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control no-cache;
    }
}
