# Docker's service DNS is re-resolved after backend replacement.
resolver 127.0.0.11 valid=10s ipv6=off;
set $backend_service backend:8000;
# No URI suffix: retain /api, query strings and the existing API contract.
proxy_pass http://$backend_service;
proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_set_header Host $http_host;
proxy_set_header X-Forwarded-Host $http_host;
proxy_set_header X-Forwarded-Proto $public_scheme;
# Overwrite incoming forwarding chains at this trusted proxy boundary.
proxy_set_header X-Forwarded-For $remote_addr;
proxy_connect_timeout 5s;
proxy_send_timeout 120s;
proxy_read_timeout 120s;
proxy_redirect off;
proxy_buffering off;
proxy_request_buffering off;
